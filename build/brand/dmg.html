<!doctype html>
<!--
  The DMG window's background, from the PIXL Brand Kit's "macOS DMG window
  background" board. Finder draws the two icons and their names on top (see
  `dmg.contents` in electron-builder.yml): the app centred at (165, 180), the
  Applications link at (495, 180). Rendered to build/background.png and
  build/background@2x.png by scripts/brand-art.mjs.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 300 700;
        src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 660px;
        height: 400px;
        overflow: hidden;
        background: #000;
      }
      .bg {
        position: relative;
        width: 660px;
        height: 400px;
        overflow: hidden;
        background: radial-gradient(90% 90% at 50% 40%, #120e22, #000 70%);
      }
      .floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 160px;
        background: radial-gradient(
          60% 100% at 50% 110%,
          rgba(123, 104, 216, 0.35),
          transparent 70%
        );
      }
      svg {
        position: absolute;
        inset: 0;
      }
      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        text-align: center;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #9a96b0;
      }
    </style>
  </head>
  <body>
    <div class="bg">
      <div class="floor"></div>
      <svg width="660" height="400" aria-hidden="true">
        <defs>
          <!-- user space: a horizontal line has no height for a bounding-box gradient -->
          <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="392" y2="0">
            <stop offset="0" stop-color="#9d8bea" stop-opacity="0" />
            <stop offset="0.7" stop-color="#9d8bea" stop-opacity="0.6" />
            <stop offset="1" stop-color="#e6dfff" />
          </linearGradient>
        </defs>
        <line x1="262" y1="180" x2="392" y2="180" stroke="url(#arrow)" stroke-width="1.5" />
        <rect x="392" y="176" width="8" height="8" fill="#e6dfff" />
        <rect x="378" y="170" width="5" height="5" fill="#9d8bea" opacity="0.6" />
        <rect x="378" y="185" width="5" height="5" fill="#9d8bea" opacity="0.6" />
      </svg>
      <span class="hint">Drag to Applications to install</span>
    </div>
  </body>
</html>
