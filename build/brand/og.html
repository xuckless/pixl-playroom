<!doctype html>
<!--
  The website's link card (og:image / twitter:image), from the PIXL Brand
  Kit's "Link card" board (OG.dc.html). The Develop mockup is a real
  screenshot of the app (site/assets/shots/develop.webp). Rendered to
  site/assets/og.png (1200×630) by `pnpm exec electron scripts/brand-art.mjs og`.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 300 700;
        src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 200 800;
        src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
        color: #ebe9f3;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      .glow {
        position: absolute;
        left: 450px;
        top: -80px;
        width: 900px;
        height: 700px;
        border-radius: 50%;
        filter: blur(80px);
        background: radial-gradient(circle, rgba(106, 77, 255, 0.42), transparent 62%);
      }
      /* .b-win from the kit's brand.css */
      .win {
        position: absolute;
        left: 560px;
        top: 150px;
        width: 720px;
        height: 450px;
        overflow: hidden;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          0 40px 120px -30px rgba(0, 0, 0, 0.95),
          0 30px 160px -60px rgba(157, 139, 234, 0.55);
      }
      .win img {
        display: block;
        width: 720px;
        height: 450px;
        object-fit: cover;
        object-position: left top;
      }
      .col {
        position: absolute;
        left: 72px;
        top: 72px;
        bottom: 72px;
        width: 460px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .lockup svg {
        width: 40px;
        height: 40px;
      }
      .wm {
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 15px;
        line-height: 1;
        white-space: nowrap;
      }
      .wm em {
        font-style: normal;
        color: #9d8bea;
      }
      .grow {
        flex-grow: 1;
      }
      h1 {
        margin: 0;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.02;
      }
      h1 span {
        color: #9d8bea;
      }
      .body {
        font-family: 'Manrope', system-ui, sans-serif;
        font-size: 19px;
        line-height: 1.55;
        color: #b8b5c7;
      }
    </style>
  </head>

      <div class="glow"></div>
