# electron-builder configuration for Pixl Playroom.
# https://www.electron.build/configuration
appId: com.xuckless.pixlplayroom
productName: Pixl Playroom
copyright: Copyright © 2026 Syed Ali (PIXL Foundation)
# No ${version} in any artifact name, so `releases/latest/download/<name>`
# links keep working from release to release (release-please cannot stamp a
# version into these names either). The version lives in the app, in
# `latest*.yml` and in the release tag.
artifactName: ${name}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,TODO.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!dev-app-update.yml'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.github,release-please-config.json,.release-please-manifest.json}'
  - '!resources/ai/**'
  - '!resources/lens-profiles/**'

# The third-party notices (scripts/third-party-notices.mjs, run after the
# build), opened from Settings and Help. Every platform's own extraResources
# add to this list.
extraResources:
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  # The beta terms, as published (scripts/legal-copy.mjs): Help → Beta Terms.
  - from: build/legal/beta-terms.txt
    to: legal/beta-terms.txt
  # The offline lens catalogue (scripts/lensfun-profiles.mjs); the app keeps
  # a newer one from the models server beside it (src/main/lensprofiles.ts).
  - from: resources/lens-profiles
    to: lens-profiles

# Native addons cannot be loaded from inside the asar archive. The engine
# binding ships as `@xuckless/pixl-engine` plus one platform package
# (`@xuckless/pixl-engine-darwin-arm64`, `-darwin-x64`, `-win32-x64-msvc`)
# holding the `.node` file. Only the platform package matching the build host
# is installed, and electron-builder bundles just that one, so a job must
# never package an arch other than its own (see `mac.target`), which
# `afterPack` enforces.
asarUnpack:
  - resources/**
  - '**/*.node'
  - 'node_modules/@xuckless/pixl-engine*/**'
  # ExifTool is a Perl script (macOS, Linux) or an .exe (Windows) run as a
  # child process: it cannot live inside the asar.
  - 'node_modules/exiftool-vendored.pl/**'
  - 'node_modules/exiftool-vendored.exe/**'

# pnpm hoists nothing; electron-builder must follow the symlinks in
# node_modules/.pnpm to collect production dependencies.
npmRebuild: false
nodeGypRebuild: false

# Electron's fuses, flipped in the packaged binary before it is signed. The
# app can't be run as plain Node or opened to a debugger, and it loads only
# its own app.asar, checked against the hash signed into the app, so an
# edited app.asar (say, with the beta gate or the licence check cut out)
# refuses to start instead of running. Check with
# `npx @electron/fuses read --app <the .app or .exe>`.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Fails the build before anything is signed, zipped or uploaded when the
# packaged app carries a binding for the wrong platform or arch, or more than
# one of them.
afterPack: ./build/after-pack.mjs

mac:
  category: public.app-category.photography
  target:
    # zip is what electron-updater downloads; dmg is what people install from.
    # No `arch` list on purpose: one would override the CLI flag and package
    # both arches from one runner, each around the host's binding. Arch comes
    # from the CLI (`--arm64` / `--x64`), one per job.
    - target: dmg
    - target: zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID are set; the Developer ID certificate comes from CSC_LINK /
  # CSC_KEY_PASSWORD. Without them the build is unsigned.
  notarize: true
  extendInfo:
    NSPhotoLibraryUsageDescription: Pixl Playroom opens the photos you choose to develop.
    NSDesktopFolderUsageDescription: Pixl Playroom opens folders of photos you choose.
    NSDocumentsFolderUsageDescription: Pixl Playroom opens folders of photos you choose.
    NSDownloadsFolderUsageDescription: Pixl Playroom opens folders of photos you choose.
    # The .pixl project type, declared as Playroom's (docs/pixl-format.md): a
    # SQLite database, so it conforms to public.data and public.database.
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.xuckless.pixlplayroom.project
        UTTypeDescription: Pixl Playroom project
        UTTypeConformsTo: [public.data, public.database, public.content]
        UTTypeIconFile: pixl.icns
        UTTypeTagSpecification:
          public.filename-extension: [pixl]
          public.mime-type: [application/vnd.pixl.project]
  # Finder's "Open With" lists Playroom for every format it reads, with the
  # document icons from scripts/doc-icons.mjs. `rank: Alternate` on purpose:
  # Playroom never makes itself the default app for a photo. Windows gets the
  # same through build/installer.nsh (electron-builder's own NSIS
  # associations would claim the default).
  fileAssociations:
    # Playroom's own project file: it owns this one (the default app for it),
    # unlike the photo formats below. Its UTI is exported in `extendInfo`.
    - name: Pixl Playroom project
      ext: pixl
      role: Editor
      rank: Owner
      icon: doc-icons/pixl
    - name: Camera RAW image
      # prettier-ignore
      ext: [cr2, cr3, crw, arw, srf, sr2, nef, nrw, raf, rw2, orf, pef, srw, mrw, 3fr, iiq, erf, kdc, x3f]
      role: Editor
      rank: Alternate
      icon: doc-icons/raw
    - name: DNG image
      ext: dng
      role: Editor
      rank: Alternate
      icon: doc-icons/dng
    - name: JPEG image
      ext: [jpg, jpeg]
      role: Editor
      rank: Alternate
      icon: doc-icons/jpg
    - name: TIFF image
      ext: [tif, tiff]
      role: Editor
      rank: Alternate
      icon: doc-icons/tiff
    - name: HEIF image
      ext: [heic, heif]
      role: Editor
      rank: Alternate
      icon: doc-icons/heic
    - name: PNG image
      ext: png
      role: Editor
      rank: Alternate
      icon: doc-icons/png
    - name: WebP image
      ext: webp
      role: Editor
      rank: Alternate
      icon: doc-icons/webp
    - name: AVIF image
      ext: avif
      role: Editor
      rank: Alternate
      icon: doc-icons/avif
    - name: JPEG XL image
      ext: jxl
      role: Editor
      rank: Alternate
      icon: doc-icons/jxl

# The window is the size of build/background.png (660×400; the @2x copy is
# merged in for Retina), drawn from build/brand/dmg.html by
# scripts/brand-art.mjs. Icon positions are their centres on that art.
dmg:
  artifactName: ${name}-mac-${arch}.${ext}
  iconSize: 128
  contents:
    - x: 165
      y: 180
      type: file
    - x: 495
      y: 180
      type: link
      path: /Applications

win:
  executableName: pixl-playroom
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    # The document icons build/installer.nsh points the file types at.
    - from: build/doc-icons
      to: doc-icons
      filter: ['*.ico']
  # Signed through Azure Trusted Signing: release.yml adds `azureSignOptions`
  # (with the certificate's publisher name) only when its secrets and
  # variables exist. No publisher name here: one would go into an unsigned
  # build's app-update.yml, and electron-updater would then refuse every
  # update not signed by that name, including the first signed one.

nsis:
  artifactName: ${name}-win-x64-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
  differentialPackage: true
  # "Open With" for every format Playroom reads, never the default app (see
  # the file itself). Untested: check on a Windows machine (RELEASING.md).
  include: build/installer.nsh

# Linux is a local testing target, not a shipped one: nothing publishes it and
# the engine ships no Linux platform package. A Linux build of the binding
# dropped beside the installed package is carried in by `asarUnpack` above.
linux:
  executableName: pixl-playroom
  category: Graphics
  # hicolor sizes, named NxN.png
  icon: build/icons
  synopsis: A photo developer built on the PIXL engine.
  target:
    - target: AppImage
      arch: [x64]

appImage:
  artifactName: ${name}-linux-${arch}.${ext}

# Updates come from updates.pixlfoundation.com (the pixl-updates R2 bucket):
# the first provider is what the app's app-update.yml points at. release.yml
# builds with `--publish always`, which skips `generic` (nothing to upload
# to), then uploads the installers into playroom/<version>/ and the feeds,
# rewritten to point there (build/prefix-feed.mjs), last.
#
# The channel is derived from the version: 0.2.0 → latest.yml, 0.2.0-beta.1
# → beta.yml. A stable release also writes beta.yml (and alpha.yml, unused),
# so the beta channel is offered a stable release newer than its last beta.
#
# GitHub is the bridge: apps up to 0.1.1-beta read GitHub's feed, so the
# next release goes to the tag's GitHub release too (its feeds in
# dist/github/; release-please has already published the release, hence
# `releaseType: release`, and EP_GH_IGNORE_TIME for older tags). Once that
# release is out, the github entry goes.
generateUpdatesFilesForAllChannels: true
publish:
  - provider: generic
    url: https://updates.pixlfoundation.com/playroom
  - provider: github
    owner: xuckless
    repo: pixl-playroom
    releaseType: release
